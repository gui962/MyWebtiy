<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>代付详情｜微信里面打开</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }
        body {
            background-color: #eeeeee;
            color:#222;
        }
        .header {
            display:flex;
            align-items:center;
            justify-content:center;
            height:52px;
            background:#ffffff;
            position:relative;
            font-size:20px;
            font-weight:500;
        }
        .header .left-icon{
            position:absolute;
            left:20px;
            font-size:22px;
        }
        .header .right-group{
            position:absolute;
            right:20px;
            display:flex;
            gap:24px;
            align-items:center;
        }
        .header .dot-more{
            width:70px;
            height:32px;
            border-radius:16px;
            border:1px solid #ddd;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .header .circle-opt{
            width:32px;
            height:32px;
            border-radius:50%;
            border:1px solid #ddd;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .user-box{
            background:#fff;
            padding:20px;
            display:flex;
            gap:14px;
            align-items:flex-start;
        }
        .avatar{
            width:48px;
            height:48px;
            border-radius:50%;
            background:#e9e9e9;
            flex-shrink:0;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:32px;
        }
        .user-text h3{
            font-size:18px;
            font-weight:500;
            margin-bottom:6px;
        }
        .user-text p{
            font-size:15px;
            color:#666;
        }
        .money-card{
            margin:14px 16px;
            background:#fff;
            border-radius:14px;
            padding:30px 22px;
            text-align:center;
        }
        .need-pay{
            font-size:20px;
            color:#333;
        }
        .price{
            font-size:54px;
            font-weight:bold;
            margin:10px 0;
        }
        .countdown-row{
            font-size:16px;
            color:#666;
        }
        .time-box{
            background:#222222;
            color:#fff;
            padding:3px 7px;
            border-radius:4px;
            font-family:monospace;
            font-size:16px;
        }
        .order-status{
            margin-top:10px;
            font-size:16px;
            color:#07c160;
            display:none;
        }
        .notice{
            margin:20px 10px;
            background:#fff9dc;
            border-radius:10px;
            padding:18px 20px;
            text-align:left;
            color:#9c7826;
            font-size:15px;
            line-height:1.7;
        }
        .notice-title{
            font-weight:500;
            margin-bottom:6px;
        }
        .btn-yellow{
            margin:0 16px;
            width:calc(100% - 32px);
            height:56px;
            border:none;
            border-radius:28px;
            background:#ffdd22;
            font-size:19px;
            font-weight:500;
            cursor:pointer;
        }
        .btn-yellow:disabled{
            background:#ccc;
            cursor:not-allowed;
        }
        .goods-card{
            margin:14px 16px;
            background:#fff;
            border-radius:14px;
            padding:20px;
        }
        .shop-title{
            font-size:18px;
            margin-bottom:18px;
        }
        .goods-item{
            display:flex;
            gap:14px;
            align-items:flex-start;
        }
        .goods-img{
            width:76px;
            height:76px;
            border-radius:8px;
            background:#eee;
            flex-shrink:0;
        }
        .goods-img img{
            width:100%;height:100%;object-fit:cover;border-radius:8px;
        }
        .goods-info{
            flex:1;
        }
        .goods-name{
            font-size:18px;
            margin-bottom:5px;
        }
        .goods-desc{
            font-size:14px;
            color:#666;
            line-height:1.4;
        }
        .goods-price{
            font-size:18px;
            font-weight:500;
        }
        .demo-tip{
            margin:40px 16px;
            font-size:12px;
            color:#999;
            text-align:center;
        }
        .mask{
            position:fixed;
            top:0;left:0;right:0;bottom:0;
            background:rgba(0,0,0,0.5);
            display:none;
            align-items:center;
            justify-content:center;
            padding:20px;
            z-index:999;
        }
        .pay-popup{
            width:100%;
            max-width:360px;
            background:#fff;
            border-radius:14px;
            padding:30px 24px;
            text-align:center;
        }
        .pop-title{
            font-size:17px;
            color:#333;
            margin-bottom:16px;
        }
        .pop-arrow{
            font-size:40px;
            color:#f56c6c;
            margin:10px 0 18px;
            animation: bounce 1s infinite;
        }
        @keyframes bounce{
            0%,100%{ transform: translateY(0); }
            50%{ transform: translateY(8px); }
        }
        /* 微信支付图片样式 */
        .wechat-pay-img{
            width: 100%;
            border-radius: 8px;
            margin-bottom:14px;
        }
        .pop-btn-close{
            margin-top:14px;
            background:#eee;
            color:#333;
            border:none;
            border-radius:24px;
            padding:10px 22px;
            font-size:15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <span class="left-icon">🏠</span>
        代付详情
        <div class="right-group">
            <div class="dot-more">•••</div>
            <div class="circle-opt">⦿</div>
        </div>
    </div>
    <div class="user-box">
        <div class="avatar">👨🏻</div>
        <div class="user-text">
            <h3>西西爱吃火腿肠</h3>
            <p>Hi～你和我的距离只差一顿外卖～</p>
        </div>
    </div>
    <div class="money-card">
        <div class="need-pay">需付款</div>
        <div class="price">¥19.90</div>
        <div class="countdown-row">
            支付剩余时间 <span class="time-box" id="timer">00:14:40</span>
        </div>
        <div class="order-status" id="paidTip">✅订单已支付</div>
        <div class="notice">
            <div class="notice-title">付款须知</div>
            <div>1.代付订单创建成功后15分钟内未付款，订单会自动取消，你可以重新下单。</div>
            <div>2.当代付订单退款成功后，实付金额将原路退还代付人。</div>
        </div>
        <button class="btn-yellow" id="payBtn">为好友买单</button>
    </div>
    <div class="goods-card">
        <div class="shop-title">茶百道（东圃大马路24h店）</div>
        <div class="goods-item">
            <div class="goods-img">
                <img src="https://s41.ax1x.com/2026/10/15/pndaUAI.png" alt="苹果派云顶美式">
            </div>
            <div class="goods-info">
                <div class="goods-name">苹果派云顶美式</div>
                <div class="goods-desc">1人份,埃塞瑰夏SOE咖啡豆,...<br>x1</div>
            </div>
            <div class="goods-price">¥18</div>
        </div>
    </div>
    <div class="demo-tip"></div>
    <div class="mask" id="mask">
        <div class="pay-popup">
            <div class="pop-title">扫码完成微信支付</div>
            <div class="pop-arrow">👇</div>
           
            <img  class="wechat-pay-img" src="im/mt.jpg" alt="微信支付">
            <button class="pop-btn-close" id="closePopBtn">关闭</button>
        </div>
    </div>
<div class="demo-tip">
        ⚠️改APP为摆地摊专用外卖服务，页面简单，类似美团，非美团官方页面
    </div>
<script>
    let timeStr = "00:14:40";
    let timer = null;
    function parseTime(t){
        let arr = t.split(':');
        return parseInt(arr[0])*3600 + parseInt(arr[1])*60 + parseInt(arr[2]);
    }
    function formatTime(s){
        let h = String(Math.floor(s/3600)).padStart(2,'0');
        let m = String(Math.floor((s%3600)/60)).padStart(2,'0');
        let sec = String(s%60).padStart(2,'0');
        return `${h}:${m}:${sec}`;
    }
    let leftSec = parseTime(timeStr);
    const timerDom = document.getElementById('timer');
    function startTimer(){
        timer = setInterval(()=>{
            leftSec--;
            if(leftSec<=0){
                clearInterval(timer);
                timerDom.innerText = "00:00:00";
                alert("订单超时自动取消");
                return;
            }
            timerDom.innerText = formatTime(leftSec);
        },1000);
    }
    startTimer();
    const mask = document.getElementById("mask");
    const payBtn = document.getElementById("payBtn");
    const closePopBtn = document.getElementById("closePopBtn");
    const paidTip = document.getElementById("paidTip");

    payBtn.onclick = function(){
        mask.style.display = "flex";
    }

    // 点击关闭，弹出取餐码输入框
    closePopBtn.onclick = function(){
        const code = prompt("请输入取餐码");
        if(code === "H526"){
            paidTip.style.display = "block";
            payBtn.disabled = true;
            payBtn.innerText = "已完成代付";
            clearInterval(timer);
            mask.style.display = "none";
        }else if(code !== null){
            alert("取餐码错误，请重新输入！");
        }
    }
</script>
</body>
</html>
